<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>rds9 health — システムの様子</title>
  <link rel="icon" href="https://rds9.net/index/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./app.css?v=20261004">
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">rds9 health</span>
      </div>
      <div class="live" id="live" data-state="ok">
        <span class="dot" aria-hidden="true"></span>
        <span id="live-text">稼働中</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">SERVER STATUS</p>
      <h1 id="headline">正常に稼働中</h1>
      <p class="lede">このサーバーは <strong id="uptime">—</strong> 動き続けています。</p>
    </section>

    <section class="grid" aria-label="システムの状況">
      <!-- 1. CPU (お手本原本) -->
      <article class="card gauge">
        <h2>CPU</h2>
        <div class="ring" id="cpu-ring" style="--value:0">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="bar" cx="60" cy="60" r="52" pathLength="100"></circle>
          </svg>
          <div class="ring-label">
            <span class="num" id="cpu">0</span>
            <span class="unit">%</span>
          </div>
        </div>
        <p class="sub" id="cpu-sub">8 コア</p>
      </article>

      <!-- 2. メモリ (お手本原本) -->
      <article class="card gauge">
        <h2>メモリ</h2>
        <div class="ring" id="mem-ring" style="--value:0">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="bar" cx="60" cy="60" r="52" pathLength="100"></circle>
          </svg>
          <div class="ring-label">
            <span class="num" id="mem">0</span>
            <span class="unit">%</span>
          </div>
        </div>
        <p class="sub" id="mem-sub">— / —</p>
      </article>

      <!-- 3. CPU の推移 (お手本原本) -->
      <article class="card wide">
        <div class="card-head">
          <h2>CPU の推移</h2>
          <span class="sub">直近 2 分</span>
        </div>
        <svg class="spark" id="spark" viewBox="0 0 600 140" preserveAspectRatio="none" role="img" aria-label="CPU 使用率の推移">
          <defs>
            <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--accent)" stop-opacity=".35"></stop>
              <stop offset="1" stop-color="var(--accent)" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <path id="spark-area" fill="url(#fill)"></path>
          <path id="spark-line" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path>
        </svg>
      </article>

      <!-- 4. まきぐもぼっと (1ボット単体・余計な文字や推測のないシンプルな柱状バー表示) -->
      <article class="card full">
        <div class="card-head">
          <h2>まきぐもぼっと</h2>
        </div>
        <div class="bot-metrics">
          <div class="bot-metric">
            <div class="bot-metric-info">
              <span class="bot-metric-label">ユーザー数</span>
              <span class="bot-metric-value" id="maki-users"><strong>1,373</strong> 人</span>
            </div>
            <div class="bot-bar-track">
              <div class="bot-bar-fill" id="bar-users" style="width: 70%;"></div>
            </div>
          </div>
          <div class="bot-metric">
            <div class="bot-metric-info">
              <span class="bot-metric-label">参加サーバー</span>
              <span class="bot-metric-value" id="maki-guilds"><strong>46</strong> サーバー</span>
            </div>
            <div class="bot-bar-track">
              <div class="bot-bar-fill" id="bar-guilds" style="width: 46%;"></div>
            </div>
          </div>
          <div class="bot-metric">
            <div class="bot-metric-info">
              <span class="bot-metric-label">Ping</span>
              <span class="bot-metric-value" id="maki-ping"><strong>174.8</strong> ms</span>
            </div>
            <div class="bot-bar-track">
              <div class="bot-bar-fill" id="bar-ping" style="width: 35%;"></div>
            </div>
          </div>
        </div>
      </article>

      <!-- 5. くわしく (お手本原本と完全同一の4項目) -->
      <article class="card stats">
        <h2>くわしく</h2>
        <dl>
          <div><dt>ロードアベレージ</dt><dd id="load">—</dd></div>
          <div><dt>空きメモリ</dt><dd id="mem-free">—</dd></div>
          <div><dt>アプリの稼働時間</dt><dd id="proc-uptime">—</dd></div>
          <div><dt>サーバー時刻</dt><dd id="time">—</dd></div>
        </dl>
      </article>
    </section>

    <footer class="foot">
      <span>Powered by <a href="https://rds9.net">rds9team</a></span>
      <span>pm2 で常駐中 · <a href="http://vps-gateway.sorahost.net:62081/api/status" target="_blank">/api/status</a> · <a href="http://vps-gateway.sorahost.net:62081/healthz" target="_blank">/healthz</a></span>
    </footer>
  </main>
  <script src="./app.js?v=20261004" defer></script>
</body>
</html>
